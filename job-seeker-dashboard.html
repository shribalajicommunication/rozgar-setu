<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Seeker Dashboard | Rozgar Setu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:#173b70;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}small{opacity:.85}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0000000b;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card h3{font-size:14px;color:#667085;margin:0 0 10px}.num{font-size:28px;font-weight:bold;color:#173b70}
button{border:0;background:#1769d2;color:white;padding:12px 16px;border-radius:9px;font-weight:bold;cursor:pointer}.secondary{background:#536477}
#msg{padding:12px;border-radius:9px;background:#eaf2ff;color:#164b91;margin-bottom:14px}.app{border-top:1px solid #e5eaf0;padding:14px 0}.meta{color:#596579;font-size:14px;line-height:1.7}.status{display:inline-block;padding:5px 10px;background:#eef2ff;border-radius:20px;font-size:12px;font-weight:bold}
</style></head><body>
<header><div><h1>Rozgar Setu</h1><small>Job Seeker Dashboard</small></div><button class="secondary" id="logout">Logout</button></header>
<div class="wrap"><section class="panel"><h2 id="welcome">Welcome</h2><div id="msg">Checking login…</div><button id="browse">Find Jobs</button> <button id="profileBtn" class="secondary">My Profile</button></section>
<div class="cards"><div class="card"><h3>Applications</h3><div class="num" id="count">—</div></div><div class="card"><h3>Profile</h3><div class="num" style="font-size:20px" id="profile">—</div></div></div>
<section class="panel"><h2>My Applications</h2><div id="apps"></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC4C1tD7zYlZZNwEnCyQBgZo1TReTSgH1E",authDomain:"rozgar-setu-843a4.firebaseapp.com",projectId:"rozgar-setu-843a4",storageBucket:"rozgar-setu-843a4.firebasestorage.app",messagingSenderId:"126750586369",appId:"1:126750586369:web:2715fb776914a8bd6a7200",measurementId:"G-X1QWM01DV5"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
document.getElementById("browse").onclick=()=>location.href="jobs.html";document.getElementById("profileBtn").onclick=()=>location.href="profile.html";document.getElementById("logout").onclick=async()=>{await signOut(auth);location.href="login.html";};
onAuthStateChanged(auth,async user=>{if(!user){location.href="login.html";return;}try{const u=await getDoc(doc(db,"users",user.uid));if(!u.exists()||u.data().role!=="jobSeeker"){location.href="login.html";return;}
const data=u.data();document.getElementById("welcome").textContent="Welcome, "+(data.fullName||"Job Seeker");document.getElementById("msg").textContent="Signed in as "+user.email;
const profileSnap=await getDoc(doc(db,"jobSeekers",user.uid));document.getElementById("profile").textContent=profileSnap.exists()?"Profile available":"Profile incomplete";
const apps=await getDocs(query(collection(db,"applications"),where("applicantId","==",user.uid)));document.getElementById("count").textContent=apps.size;const box=document.getElementById("apps");
if(apps.empty){box.innerHTML='<p style="color:#64748b">You have not applied for any jobs yet.</p>';return;}
for(const aDoc of apps.docs){
 const a=aDoc.data(),row=document.createElement("div");row.className="app";
 let job={};try{if(a.jobId){const j=await getDoc(doc(db,"jobs",a.jobId));if(j.exists())job=j.data();}}catch(e){console.warn("Job details unavailable",e)}
 const title=document.createElement("h3");title.textContent=a.jobTitle||job.title||"Job Application";
 const info=document.createElement("div");info.className="meta";
 const submitted=a.createdAt?.toDate?a.createdAt.toDate().toLocaleDateString():"";
 info.textContent="Organization: "+(a.organizationName||job.organizationName||"Not available")+" • Location: "+(job.location||"Not available")+" • Submitted: "+submitted;
 const st=document.createElement("span");st.className="status";st.textContent="Application status: "+(a.status||"Applied");
 row.append(title,info,st);box.append(row);
}
}catch(e){console.error(e);document.getElementById("msg").textContent="Could not load dashboard. Check Firestore rules.";}});</script></body></html>
