<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - Rozgar Setu</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#222}header{background:#1769aa;color:white;text-align:center;padding:22px 15px}header h1{margin:0}.container{max-width:600px;margin:30px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.08)}h2{text-align:center;color:#1769aa}.role-buttons{display:flex;gap:10px;margin-bottom:20px}.role-buttons button{flex:1;padding:14px;border:1px solid #1769aa;border-radius:8px;background:white;color:#1769aa;font-weight:bold;cursor:pointer}.role-buttons button.active{background:#1769aa;color:white}label{display:block;margin-top:14px;font-weight:bold}input{width:100%;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:8px;font-size:16px}.submit-btn{width:100%;padding:15px;margin-top:22px;background:#ff9800;color:#222;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer}.submit-btn:disabled{opacity:.6}.message{margin-top:15px;text-align:center;font-weight:bold;overflow-wrap:anywhere}.login-link{text-align:center;margin-top:20px}.login-link a{color:#1769aa;text-decoration:none}footer{text-align:center;padding:20px;color:#666}@media(max-width:500px){.container{margin:15px;padding:20px}}</style></head><body>
<header><h1>Rozgar Setu</h1><p>Find Opportunities. Connect Talent.</p></header><div class="container"><h2>Create Your Account</h2>
<div class="role-buttons"><button type="button" id="jobBtn" class="active" onclick="selectRole('jobSeeker')">Job Seeker</button><button type="button" id="empBtn" onclick="selectRole('employer')">Employer / Organization</button></div>
<form id="registerForm"><div id="jobFields"><label for="fullName">Full Name</label><input type="text" id="fullName" placeholder="Enter your full name"></div>
<div id="employerFields" hidden><label for="organizationName">Company / Organization / Institution Name</label><input type="text" id="organizationName" placeholder="Enter company or organization name"><label for="contactPerson">Contact Person Name</label><input type="text" id="contactPerson" placeholder="Enter contact person's name"></div>
<label for="mobile">Mobile Number</label><input type="tel" id="mobile" placeholder="Enter 10 digit mobile number" maxlength="10" pattern="[0-9]{10}" required><label for="email">Email Address</label><input type="email" id="email" placeholder="Enter your email" required><label for="password">Password</label><input type="password" id="password" placeholder="Create password (minimum 6 characters)" minlength="6" required><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required><button type="submit" class="submit-btn" id="submitBtn">Create Account</button><div class="message" id="message"></div></form>
<div class="login-link">Already have an account? <a href="login.html">Login</a></div></div><footer>© 2026 Rozgar Setu</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC4C1tD7zYlZZNwEnCyQBgZo1TReTSgH1E",authDomain:"rozgar-setu-843a4.firebaseapp.com",projectId:"rozgar-setu-843a4",storageBucket:"rozgar-setu-843a4.firebasestorage.app",messagingSenderId:"126750586369",appId:"1:126750586369:web:2715fb776914a8bd6a7200",measurementId:"G-X1QWM01DV5"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let selectedRole="jobSeeker";
const jobFields=document.getElementById("jobFields"),employerFields=document.getElementById("employerFields"),fullNameInput=document.getElementById("fullName"),orgInput=document.getElementById("organizationName"),contactInput=document.getElementById("contactPerson");
window.selectRole=function(role){selectedRole=role;document.getElementById("jobBtn").classList.toggle("active",role==="jobSeeker");document.getElementById("empBtn").classList.toggle("active",role==="employer");jobFields.hidden=role!=="jobSeeker";employerFields.hidden=role!=="employer";fullNameInput.required=role==="jobSeeker";orgInput.required=role==="employer";contactInput.required=role==="employer";};selectRole("jobSeeker");
document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();const mobile=document.getElementById("mobile").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,confirmPassword=document.getElementById("confirmPassword").value,message=document.getElementById("message"),submitBtn=document.getElementById("submitBtn");message.style.color="#d93025";message.textContent="";if(!/^[0-9]{10}$/.test(mobile)){message.textContent="Please enter a valid 10 digit mobile number.";return;}if(password!==confirmPassword){message.textContent="Passwords do not match.";return;}submitBtn.disabled=true;submitBtn.textContent="Creating Account...";try{const userCredential=await createUserWithEmailAndPassword(auth,email,password),uid=userCredential.user.uid;if(selectedRole==="jobSeeker"){const fullName=fullNameInput.value.trim();await setDoc(doc(db,"users",uid),{uid,fullName,mobile,email,role:selectedRole,createdAt:serverTimestamp()});await setDoc(doc(db,"jobSeekers",uid),{uid,fullName,mobile,email,profileStatus:"incomplete",createdAt:serverTimestamp()});}else{const organizationName=orgInput.value.trim(),contactPerson=contactInput.value.trim();await setDoc(doc(db,"users",uid),{uid,organizationName,contactPerson,mobile,email,role:selectedRole,createdAt:serverTimestamp()});await setDoc(doc(db,"employers",uid),{uid,organizationName,contactPerson,mobile,email,verificationStatus:"pending",createdAt:serverTimestamp()});}message.style.color="green";message.textContent="Registration successful! Your account has been created.";document.getElementById("registerForm").reset();selectRole("jobSeeker");submitBtn.textContent="Account Created";}catch(error){console.error(error);if(error.code==="auth/email-already-in-use")message.textContent="This email is already registered.";else if(error.code==="auth/weak-password")message.textContent="Password must be at least 6 characters.";else if(error.code==="auth/invalid-email")message.textContent="Please enter a valid email address.";else message.textContent="Registration failed: "+error.message;submitBtn.disabled=false;submitBtn.textContent="Create Account";}});
</script></body></html>
