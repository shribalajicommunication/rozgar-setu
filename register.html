
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Rozgar Setu</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#222;
}
header{
  background:#1769aa;
  color:white;
  text-align:center;
  padding:22px;
}
header h1{margin:0}
.container{
  max-width:600px;
  margin:25px auto;
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
h2{text-align:center;color:#1769aa}
.role-buttons{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.role-buttons button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#ddd;
  font-weight:bold;
  cursor:pointer;
}
.role-buttons button.active{
  background:#1769aa;
  color:white;
}
input{
  width:100%;
  padding:13px;
  margin:9px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
.submit-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#ff9800;
  color:#222;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}
.hidden{display:none}
#message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  overflow-wrap:anywhere;
}
footer{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<header>
<h1>🌉 Rozgar Setu</h1>
<p>Find Opportunities. Connect Talent.</p>
</header>

<div class="container">

<h2>Create Your Account</h2>

<div class="role-buttons">
<button type="button" id="jobBtn"
class="active" onclick="selectRole('jobSeeker')">
Job Seeker
</button>

<button type="button" id="empBtn"
onclick="selectRole('employer')">
Employer
</button>
</div>

<form id="registerForm">

<div id="empFields" class="hidden">
<input type="text" id="companyName"
placeholder="Company / Institution Name">
</div>

<input type="text" id="fullName"
placeholder="Full Name" required>

<input type="email" id="email"
placeholder="Email Address" required>

<input type="tel" id="mobile"
placeholder="Mobile Number" required
maxlength="10">

<div id="jobFields">
<input type="text" id="qualification"
placeholder="Qualification">
<input type="text" id="skills"
placeholder="Skills">
</div>

<input type="password" id="password"
placeholder="Password (minimum 6 characters)"
required>

<input type="password" id="confirmPassword"
placeholder="Confirm Password" required>

<button class="submit-btn" id="submitBtn"
type="submit">
Create Account
</button>

</form>

<div id="message"></div>

</div>

<footer>
© 2026 Rozgar Setu
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, createUserWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, setDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyC4C1tD7zYlZZNwEnCyQBgZo1TReTSgH1E",
  authDomain: "rozgar-setu-843a4.firebaseapp.com",
  projectId: "rozgar-setu-843a4",
  storageBucket: "rozgar-setu-843a4.firebasestorage.app",
  messagingSenderId: "126750586369",
  appId: "1:126750586369:web:2715fb776914a8bd6a7200",
  measurementId: "G-X1QWM01DV5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let selectedRole = "jobSeeker";

window.selectRole = function(role){

  selectedRole = role;

  document.getElementById("jobFields")
  .classList.toggle("hidden", role !== "jobSeeker");

  document.getElementById("empFields")
  .classList.toggle("hidden", role !== "employer");

  document.getElementById("jobBtn")
  .classList.toggle("active", role === "jobSeeker");

  document.getElementById("empBtn")
  .classList.toggle("active", role === "employer");
};

document.getElementById("registerForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const companyName = document.getElementById("companyName").value.trim();
  const qualification = document.getElementById("qualification").value.trim();
  const skills = document.getElementById("skills").value.trim();

  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  message.style.color = "red";

  if(!/^[6-9]\d{9}$/.test(mobile)){
    message.textContent = "Enter a valid 10-digit mobile number.";
    return;
  }

  if(password.length < 6){
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  if(password !== confirmPassword){
    message.textContent = "Passwords do not match.";
    return;
  }

  if(selectedRole === "employer" && !companyName){
    message.textContent = "Please enter company name.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating Account...";
  message.textContent = "";

  try{

    const userCredential =
    await createUserWithEmailAndPassword(auth, email, password);

    const uid = userCredential.user.uid;

    const profile = {
      uid: uid,
      name: name,
      email: email,
      mobile: mobile,
      role: selectedRole,
      createdAt: new Date().toISOString(),
      accountStatus: "active"
    };

    if(selectedRole === "jobSeeker"){
      profile.qualification = qualification;
      profile.skills = skills;
    }

    if(selectedRole === "employer"){
      profile.companyName = companyName;
      profile.verificationStatus = "pending";
    }

    await setDoc(doc(db, "users", uid), profile);

    message.style.color = "green";
    message.textContent =
    "Registration successful! Your account has been created.";

    document.getElementById("registerForm").reset();

  }catch(error){

    message.style.color = "red";

    if(error.code === "auth/email-already-in-use"){
      message.textContent = "This email is already registered.";
    }
    else if(error.code === "auth/weak-password"){
      message.textContent = "Please choose a stronger password.";
    }
    else{
      message.textContent = error.message;
    }

  }finally{

    submitBtn.disabled = false;
    submitBtn.textContent = "Create Account";

  }

});

</script>

</body>
</html>
