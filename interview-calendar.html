<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Calendar | Rozgar Setu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}header{background:#173b70;color:#fff;padding:20px}header h1{margin:0 0 5px;font-size:24px}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0000000b;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}button{border:0;background:#1769d2;color:#fff;padding:12px 16px;border-radius:9px;font-weight:bold;cursor:pointer}.secondary{background:#536477}input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.event{border:1px solid #dbe5f1;border-left:5px solid #1769d2;border-radius:12px;padding:15px;margin:12px 0;background:#f8fbff}.event h3{margin:0 0 8px}.meta{color:#596579;line-height:1.7}.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:20px;font-weight:bold;font-size:13px}.empty{color:#64748b;padding:15px}.error{color:#b91c1c}.dayhead{font-weight:bold;font-size:18px;margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid #e2e8f0}@media(max-width:600px){.wrap{padding:12px}.panel{padding:16px}}
</style></head><body>
<header><h1>Rozgar Setu</h1><div>Interview Calendar</div></header><main class="wrap"><section class="panel"><h2 id="heading">Interview Schedule</h2><div id="msg" class="meta">Checking login…</div><div class="toolbar"><input type="date" id="dateFilter"><button id="clearFilter" class="secondary">Show All</button><button id="refresh">Refresh</button><button id="back">Dashboard</button></div><div id="events"><p class="empty">Loading interviews…</p></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC4C1tD7zYlZZNwEnCyQBgZo1TReTSgH1E",authDomain:"rozgar-setu-843a4.firebaseapp.com",projectId:"rozgar-setu-843a4",storageBucket:"rozgar-setu-843a4.firebasestorage.app",messagingSenderId:"126750586369",appId:"1:126750586369:web:2715fb776914a8bd6a7200",measurementId:"G-X1QWM01DV5"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,role="",all=[];
const box=document.getElementById("events"),filter=document.getElementById("dateFilter");document.getElementById("refresh").onclick=load;document.getElementById("clearFilter").onclick=()=>{filter.value="";render();};filter.onchange=render;
document.getElementById("back").onclick=()=>location.href=role==="employer"?"employer-dashboard.html":"job-seeker-dashboard.html";
function fmtDate(d){if(!d)return"Date not set";const p=d.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}
function render(){const selected=filter.value;const list=all.filter(x=>!selected||x.interviewDate===selected);box.innerHTML="";if(!list.length){box.innerHTML='<p class="empty">No scheduled interviews'+(selected?' for this date':'')+'.</p>';return;}let last="";for(const a of list){if(a.interviewDate!==last){const dh=document.createElement("div");dh.className="dayhead";dh.textContent=fmtDate(a.interviewDate);box.append(dh);last=a.interviewDate;}const card=document.createElement("div");card.className="event";const title=document.createElement("h3");title.textContent=a.jobTitle||"Job Interview";const candidate=document.createElement("div");candidate.className="meta";candidate.textContent=role==="employer"?"Candidate: "+(a.candidateName||a.fullName||a.applicantName||a.applicantEmail||"Candidate"):("Organization: "+(a.organizationName||a.companyName||a.employerName||a.jobOrganizationName||a.jobCompanyName||"Organization not available"));const details=document.createElement("div");details.className="meta";details.textContent=`Time: ${a.interviewTime||"Not set"} • Mode: ${a.interviewMode||"Not set"}`;const status=document.createElement("div");status.style.marginTop="8px";const tag=document.createElement("span");tag.className="tag";tag.textContent="Application: "+(a.status||"Applied");status.append(tag);card.append(title,candidate,details,status);if(a.interviewDetails){const ins=document.createElement("p");ins.className="meta";ins.textContent="Instructions: "+a.interviewDetails;card.append(ins);}box.append(card);}}
async function load(){box.innerHTML='<p class="empty">Loading interviews…</p>';if(!user)return;try{let records=[];if(role==="employer"){const jobSnap=await getDocs(query(collection(db,"jobs"),where("employerId","==",user.uid)));for(const jd of jobSnap.docs){const appSnap=await getDocs(query(collection(db,"applications"),where("jobId","==",jd.id)));records.push(...appSnap.docs.map(d=>({id:d.id,...d.data()})));}}else{const snap=await getDocs(query(collection(db,"applications"),where("applicantId","==",user.uid)));records=snap.docs.map(d=>({id:d.id,...d.data()}));
// For candidates, enrich missing organization names from the publicly readable job document.
for(const a of records){if(!(a.organizationName||a.companyName||a.employerName)&&a.jobId){try{const js=await getDoc(doc(db,"jobs",a.jobId));if(js.exists()){const jd=js.data();a.jobOrganizationName=jd.organizationName||jd.companyName||jd.employerName||jd.company||jd.employerDisplayName||"";if(!a.jobTitle)a.jobTitle=jd.title||jd.jobTitle||"Job Interview";}}catch(err){console.warn("Could not fetch job organization name",a.jobId,err);}}}}
all=records.filter(a=>a.interviewDate&&a.interviewTime);all.sort((a,b)=>(a.interviewDate||"").localeCompare(b.interviewDate||"")||(a.interviewTime||"").localeCompare(b.interviewTime||""));render();}catch(e){console.error("Interview Calendar load error:",e);box.innerHTML='<p class="error">Could not load interviews. Error: '+(e.code||e.message||"unknown")+'</p>';}}
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return;}user=u;try{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()){location.href="login.html";return;}role=s.data().role||"";if(role!=="employer"&&role!=="jobSeeker"){box.innerHTML='<p class="error">This calendar is available for Employers and Job Seekers.</p>';return;}document.getElementById("heading").textContent=role==="employer"?"Your Candidate Interviews":"Your Upcoming Interviews";document.getElementById("msg").textContent="Signed in as "+u.email;document.getElementById("back").textContent="Back to Dashboard";document.getElementById("back").onclick=()=>location.href=role==="employer"?"employer-dashboard.html":"job-seeker-dashboard.html";await load();}catch(e){console.error(e);document.getElementById("msg").textContent="Could not verify account.";}});
</script></body></html>
